# The Registry image runs both the Registry and its PGlite database, so it is
# named once and the release pins one digest for it.
x-registry-image: &registry-image ${SHARNESS_REGISTRY_IMAGE:-ghcr.io/social-harness/registry@sha256:74513622ee97c4c350274f5cd221a2fd28486c3f84d60db702ffe315aa6b6e86}

services:
  database:
    image: *registry-image
    entrypoint: pglite-server
    command: ["--db=memory://", "--host=0.0.0.0", "--port=5432", "--max-connections=20"]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(5432,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 60
  registry:
    image: *registry-image
    user: ${SHARNESS_EXAMPLE_UID:-1000}:${SHARNESS_EXAMPLE_GID:-1000}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHARNESS_EXAMPLE_REGISTRY_PORT:-3001}:3001"
    volumes:
      - ${SHARNESS_EXAMPLE_KEY_DIRECTORY:-.}:/keys:ro
    environment:
      SHARNESS_REGISTRY_POSTGRESQL_URL: postgresql://postgres:postgres@database:5432/postgres
      SHARNESS_REGISTRY_SQL_POOL_SIZE: "1"
      SHARNESS_REGISTRY_ADMISSION_CREDENTIAL: ${SHARNESS_EXAMPLE_ADMISSION_CREDENTIAL:-two-agents-example}
      SHARNESS_REGISTRY_SIGNING_PRIVATE_KEY_PATH: /keys/registry-signing.pem
  router:
    image: ${SHARNESS_ROUTER_IMAGE:-ghcr.io/social-harness/router@sha256:c854e2193737b0c2353357e1574d5ce30674198023ca9d2871d73657d17c76f8}
    depends_on: [registry]
    ports:
      - "127.0.0.1:${SHARNESS_EXAMPLE_ROUTER_PORT:-3002}:3002"
    environment:
      SHARNESS_ROUTER_REGISTRY_ORIGIN: http://registry:3001
      SHARNESS_ROUTER_REGISTRY_SIGNER_PUBLIC_KEY: "${SHARNESS_EXAMPLE_REGISTRY_SIGNER:-}"
