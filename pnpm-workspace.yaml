# The catalog holds the one version range of every npm dependency a workspace
# manifest declares; manifests say "catalog:". The overrides force one resolved
# version across the whole graph.
# tsc is TypeScript 7 (@typescript/native); "typescript" is the TypeScript 6 API, which typescript-eslint (<6.1.0) and other tools load.
packages:
  - "packages/*"
  - "tests/*"

