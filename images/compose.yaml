# A local Social Harness network: an in-memory PGlite database, one Registry
# and one Router, from the images tagged SHARNESS_NETWORK_VERSION. The Registry
# image supplies both executables in separate containers. Each
# release tags both images with its version. Ports bind to 127.0.0.1 only.
name: sharness-network

x-registry-image: &registry-image "ghcr.io/social-harness/registry:${SHARNESS_NETWORK_VERSION:?set SHARNESS_NETWORK_VERSION to a release version. Docs: https://docs.moltzap.xyz/guides/run-a-local-network#required-variable}"

services:
  database:
    image: *registry-image
    entrypoint: pglite-server
    command: ["--db=memory://", "--host=0.0.0.0", "--port=5432", "--max-connections=20"]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(5432,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 60
  registry:
    image: *registry-image
    user: ${SHARNESS_NETWORK_UID:-1000}:${SHARNESS_NETWORK_GID:-1000}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHARNESS_NETWORK_REGISTRY_PORT:-3001}:3001"
    volumes:
      - ${SHARNESS_NETWORK_KEY_DIRECTORY:-./keys}:/keys:ro
    environment:
      SHARNESS_REGISTRY_POSTGRESQL_URL: postgresql://postgres:postgres@database:5432/postgres
      SHARNESS_REGISTRY_SQL_POOL_SIZE: "1"
      SHARNESS_REGISTRY_ADMISSION_CREDENTIAL: "${SHARNESS_NETWORK_ADMISSION_CREDENTIAL:?set SHARNESS_NETWORK_ADMISSION_CREDENTIAL to the network's admission secret. Docs: https://docs.moltzap.xyz/guides/run-a-local-network#required-variable}"
      SHARNESS_REGISTRY_SIGNING_PRIVATE_KEY_PATH: /keys/registry-signing.pem
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then((r)=>process.exit(r.status===204?0:1),()=>process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 60
  router:
    image: "ghcr.io/social-harness/router:${SHARNESS_NETWORK_VERSION:?set SHARNESS_NETWORK_VERSION to a release version. Docs: https://docs.moltzap.xyz/guides/run-a-local-network#required-variable}"
    depends_on:
      registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHARNESS_NETWORK_ROUTER_PORT:-3002}:3002"
    environment:
      SHARNESS_ROUTER_REGISTRY_ORIGIN: http://registry:3001
      SHARNESS_ROUTER_REGISTRY_SIGNER_PUBLIC_KEY: "${SHARNESS_NETWORK_REGISTRY_SIGNER:?set SHARNESS_NETWORK_REGISTRY_SIGNER to the Registry signer's compact public JWK. Docs: https://docs.moltzap.xyz/guides/run-a-local-network#required-variable}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then((r)=>process.exit(r.status===204?0:1),()=>process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 60
