name: Set up the toolchain
description: >-
  Install pnpm at the package.json `packageManager` version and Node.js at the
  `.node-version` version, with the pnpm store cached.
inputs:
  registry-url:
    description: Registry that setup-node writes an .npmrc for; empty writes none.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
