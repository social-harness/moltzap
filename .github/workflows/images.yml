name: Publish images

# Registry, Router, daemon and OpenClaw agent publish native amd64/arm64 indexes
# on main. Each committed input key sha256:<hex> names inputs-<hex>; releases
# tag only the Registry and Router indexes (publish.yml). Every service builds
# with docker buildx from its Dockerfile alone, so the build jobs, which hold
# the publishing token, install and build nothing on the runner. Platform
# images and indexes push by digest first. The index is signed with
# https://github.com/social-harness/moltzap/.github/workflows/images.yml@refs/heads/main
# and issuer https://token.actions.githubusercontent.com before its input tag
# is created. Existing input tags are skipped, never retagged; partial reruns
# converge by building only missing services. Each service publishes from its
# own two platform digests, so a service whose build fails leaves the others
# publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_CERTIFICATE_IDENTITY: https://github.com/social-harness/moltzap/.github/workflows/images.yml@refs/heads/main
  IMAGE_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

defaults:
  run:
    shell: bash

jobs:
  keys:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
      missing: ${{ steps.keys.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve committed input tags
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          keys=$(pnpm --silent image:keys)
          missing='[]'
          for service in registry router daemon openclaw-agent; do
            key=$(jq -r --arg s "$service" '.[$s] | sub("^sha256:"; "")' <<<"$keys")
            image="ghcr.io/social-harness/$service"
            status=0
            digest=$(scripts/release/ghcr-digest.sh "$image:inputs-$key") || status=$?
            case $status in
              0) cosign verify \
                --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "$image@$digest" ;;
              1) missing=$(jq -c --arg s "$service" '. + [$s]' <<<"$missing") ;;
              *) exit "$status" ;;
            esac
          done
          {
            echo "keys=$(jq -c . <<<"$keys")"
            echo "missing=$missing"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: keys
    if: needs.keys.outputs.missing != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.keys.outputs.missing) }}
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Push native platform by digest
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ matrix.service }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use \
            --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          context=.
          if [[ "$SERVICE" == openclaw-agent ]]; then
            context=images/openclaw-agent
          fi
          docker buildx build --platform "linux/$PLATFORM" \
            --file "images/$SERVICE/Dockerfile" \
            --output "type=image,name=ghcr.io/social-harness/$SERVICE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" "$context"
          jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: [keys, build]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.keys.outputs.missing != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.keys.outputs.missing) }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish signed index and input tag
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ matrix.service }}
          KEYS: ${{ needs.keys.outputs.keys }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/social-harness/$SERVICE"
          key=$(jq -r --arg s "$SERVICE" '.[$s] | sub("^sha256:"; "")' <<<"$KEYS")
          tag="$image:inputs-$key"
          status=0
          digest=$(scripts/release/ghcr-digest.sh "$tag") || status=$?
          case $status in
            0)
              cosign verify \
                --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "$image@$digest"
              exit 0
              ;;
            1) ;;
            *) exit "$status" ;;
          esac
          sources=("$image@$(cat "$RUNNER_TEMP/digests/amd64")" "$image@$(cat "$RUNNER_TEMP/digests/arm64")")
          index=$(docker buildx imagetools create --dry-run "${sources[@]}")
          printf '%s' "$index" > "$RUNNER_TEMP/index.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/index.json" | cut -d ' ' -f1)"
          ref="$image@$digest"
          docker buildx imagetools create --tag "$ref" "${sources[@]}"
          cosign sign --yes "$ref"
          docker buildx imagetools create --tag "$tag" "$ref"
