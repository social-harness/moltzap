name: Publish service images

# Registry and Router publish as native amd64/arm64 indexes on main.
# Each committed input key sha256:<hex> names inputs-<hex>. Platform images
# and indexes push by digest first. The index is signed and verified with
# https://github.com/social-harness/moltzap/.github/workflows/images.yml@refs/heads/main
# and issuer https://token.actions.githubusercontent.com before its input tag
# is created. Existing input tags are skipped, never retagged; partial reruns
# converge by building only missing services. A publication, or any rerun,
# sends repository_dispatch moltzap-images to social-harness/deployment with
# client_payload {"registry":"ghcr.io/social-harness/registry@sha256:…",
# "router":"ghcr.io/social-harness/router@sha256:…"} for both current keys.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  keys:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      keys: ${{ steps.keys.outputs.keys }}
      missing: ${{ steps.keys.outputs.missing }}
      present: ${{ steps.keys.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Resolve committed input tags
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          keys=$(pnpm --silent image:keys)
          missing='[]'
          present='{}'
          for service in registry router; do
            key=$(jq -r --arg s "$service" '.[$s] | sub("^sha256:"; "")' <<<"$keys")
            image="ghcr.io/social-harness/$service"
            if digest=$(docker buildx imagetools inspect "$image:inputs-$key" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect-error"); then
              present=$(jq -c --arg s "$service" --arg ref "$image@$digest" '. + {($s): $ref}' <<<"$present")
            elif grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/inspect-error"; then
              missing=$(jq -c --arg s "$service" '. + [$s]' <<<"$missing")
            else
              cat "$RUNNER_TEMP/inspect-error" >&2
              exit 1
            fi
          done
          {
            echo "keys=$(jq -c . <<<"$keys")"
            echo "missing=$missing"
            echo "present=$present"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: keys
    if: needs.keys.outputs.missing != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.keys.outputs.missing) }}
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Push native platform by digest
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ matrix.service }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform "linux/$PLATFORM" \
            --file "images/$SERVICE/Dockerfile" \
            --output "type=image,name=ghcr.io/social-harness/$SERVICE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .
          jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: [keys, build]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.keys.outputs.missing) }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish verified index and input tag
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ matrix.service }}
          KEYS: ${{ needs.keys.outputs.keys }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/social-harness/$SERVICE"
          key=$(jq -r --arg s "$SERVICE" '.[$s] | sub("^sha256:"; "")' <<<"$KEYS")
          tag="$image:inputs-$key"
          if docker buildx imagetools inspect "$tag" 2>"$RUNNER_TEMP/inspect-error"; then
            exit 0
          elif ! grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/inspect-error"; then
            cat "$RUNNER_TEMP/inspect-error" >&2
            exit 1
          fi
          sources=("$image@$(cat "$RUNNER_TEMP/digests/amd64")" "$image@$(cat "$RUNNER_TEMP/digests/arm64")")
          index=$(docker buildx imagetools create --dry-run "${sources[@]}")
          printf '%s' "$index" > "$RUNNER_TEMP/index.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/index.json" | cut -d ' ' -f1)"
          ref="$image@$digest"
          docker buildx imagetools create --tag "$ref" "${sources[@]}"
          cosign sign --yes "$ref"
          cosign verify \
            --certificate-identity https://github.com/social-harness/moltzap/.github/workflows/images.yml@refs/heads/main \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref"
          docker buildx imagetools create --tag "$tag" "$ref"

  dispatch:
    needs: [keys, build, publish]
    if: >-
      always() && needs.keys.result == 'success' &&
      (needs.publish.result == 'success' || github.run_attempt > 1)
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: social-harness
          repositories: deployment
          permission-contents: write
      - name: Dispatch both current index references
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REGISTRY_TOKEN: ${{ github.token }}
          KEYS: ${{ needs.keys.outputs.keys }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          payload='{}'
          for service in registry router; do
            key=$(jq -r --arg s "$service" '.[$s] | sub("^sha256:"; "")' <<<"$KEYS")
            image="ghcr.io/social-harness/$service"
            digest=$(docker buildx imagetools inspect "$image:inputs-$key" --format '{{.Manifest.Digest}}')
            payload=$(jq -c --arg s "$service" --arg ref "$image@$digest" '. + {($s): $ref}' <<<"$payload")
          done
          jq -n --argjson payload "$payload" '{event_type: "moltzap-images", client_payload: $payload}' \
            | gh api --method POST repos/social-harness/deployment/dispatches --input -
