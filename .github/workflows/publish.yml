name: Publish to npm

# One release computes one calendar version and publishes, at that version,
# only the packages whose packed content changed since the version their
# manifest names: `scripts/release/select-packages.ts` compares each
# package's content hash with the `sharnessContentHash` npm recorded for that
# version. A dependent of a selected package is selected too, because its
# packed manifest pins the sibling's new version, so every published package
# pins its siblings to their newest published versions. Each published
# manifest records its own content hash; the OpenClaw channel's also records
# `sharnessHostCodeHash` (`scripts/release/host-code-hash.ts`), the hash of the
# code OpenClaw loads for it. The release commit records every manifest. The
# trigger is release-on-merge.yml after CI passes on main, or manual dispatch
# for resets, resumes and start_new_version. The bump resolves both committed
# image input keys to signed indexes and records their digests in the example
# Compose file. It polls for missing keys for up to 45 minutes, then fails
# before the release commit with a rerun hint. After npm publication, `images`
# runs no repository install or build, adds version tags, and lists both digests
# in the GitHub release body. Existing version tags are checked and skipped
# on reruns.
# After image tagging, dispatch sends the release version and digests to deployment.
#
# A release takes two runs, so npm's provenance names the commit whose tree
# the tarballs were packed from. The dispatched run bumps: it writes the
# release commit and tag, pushes them, and dispatches this workflow again on
# main. That second run finds the release commit at the tip, resumes it, and
# publishes; its OIDC token, and so the SLSA provenance, carries the release
# commit's sha, and its workflow identity stays this file on refs/heads/main,
# the one `sharnessd-launcher` trusts.
#
# Each run splits into jobs by what they may touch. `build` installs, builds,
# runs the pack gates and packs, with no OIDC token and no App token, so
# nothing a dependency runs there can publish or push. `push` holds the
# release App token and runs no installed code: it checks the release
# commit `build` made, pushes it with its tag, and dispatches the resume.
# `publish` holds the OIDC token and runs no install or build: it checks the
# tarballs `build` packed against the release commit's manifests and content
# hashes and publishes them. A dependency compromised in both runs' builds
# could still pack code the release commit's hashes describe; the split keeps
# the tokens out of its reach.
#
# A rerun after a partial failure converges rather than minting a second
# release. Before the release commit exists, the version is recomputed from
# npm and the release tags (unchanged while nothing is published at it and
# the UTC day has not turned). Once the release commit is on main, any run
# finds it, checks out its tree, and publishes whatever manifest version
# there npm still lacks and finishes image tags and release notes, however
# many commits landed since. A run on an
# older commit while the release commit is still the tip, such as a rerun of
# the bump run, dispatches a fresh run rather than publishing; once main has
# moved past the release commit, the run publishes and its provenance names
# the dispatched commit instead. A release that can never complete is left behind by
# dispatching with `start_new_version`, which mints the next version from the
# tip instead.
#
# Prerequisites: a release GitHub App installed on this repository with
# contents write and allowed to push main, and on social-harness/deployment
# with contents write for the release dispatches; its client ID in the Actions
# variable RELEASE_APP_CLIENT_ID and its private key in the Actions secret
# RELEASE_APP_PRIVATE_KEY. npm publishes without a token, so each published
# package lists this repository's publish.yml in the `release` environment as
# a trusted publisher; a newly published package needs that entry first.
on:
  workflow_dispatch:
    inputs:
      gated_commit:
        description: >-
          Set by release-on-merge.yml to the commit whose CI passed. The run
          mints a version only for that commit, while it is main's tip, and
          only if the release gate still passes on it.
        type: string
        default: ""
      start_new_version:
        description: >-
          Abandon an incomplete release commit on main instead of resuming it
          and mint the next version from the tip. Deprecate by hand whatever
          the abandoned version did publish.
        type: boolean
        default: false

# Two releases must never interleave: both would compute the same version from
# the same npm state and race to push its release commit and tag. The resume
# run that a bump dispatches waits here until the bump run ends. The group is
# per ref, so a dispatch on another branch, which runs nothing, never replaces
# a pending main run.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# `bash` here means `bash -eo pipefail`, so a command that fails inside a
# pipeline fails its step instead of handing a partial result to the next.
defaults:
  run:
    shell: bash

# Dependency order: each package comes after the siblings it depends on, which
# the selection checks.
env:
  RELEASE_PACKAGES: client openclaw-channel
  IMAGE_CERTIFICATE_IDENTITY: https://github.com/social-harness/moltzap/.github/workflows/images.yml@refs/heads/main
  IMAGE_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    # Only main releases. A dispatch may name any branch, and the later jobs
    # push and publish, so an unreviewed branch must not reach here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      packages: ${{ steps.select.outputs.packages }}
      release-commit: ${{ steps.plan.outputs.release-commit }}
    steps:
      # Full history: the plan step looks for the last release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          registry-url: https://registry.npmjs.org

      # The last release commit on main decides whether this run resumes it:
      # a manifest version there that npm still lacks is published from that
      # commit's own tree. A run started on an older commit while the release
      # commit is still the tip, such as a rerun of the bump run, only
      # dispatches a fresh run, whose provenance then names the release
      # commit. Otherwise the run releases the dispatched commit, which must
      # still be the tip of main so that the release commit and npm's
      # provenance describe one tree.
      - name: Decide whether this run bumps or resumes a release
        id: plan
        env:
          START_NEW_VERSION: ${{ inputs.start_new_version }}
          GATED_COMMIT: ${{ inputs.gated_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          RELEASE_LINE=$(git log origin/main --format='%H %s' | grep -m1 ' chore(release): moltzap@' || true)
          if [ -n "$RELEASE_LINE" ]; then
            RELEASE_COMMIT=${RELEASE_LINE%% *}
            VERSION=${RELEASE_LINE#* chore(release): moltzap@}
            [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]] || {
              echo "ERROR: release commit $RELEASE_COMMIT has an unreadable version '$VERSION'"
              exit 1
            }
            MISSING=""
            for pkg in $RELEASE_PACKAGES; do
              MANIFEST=$(git show "$RELEASE_COMMIT:packages/$pkg/package.json" 2>/dev/null) || continue
              NAME=$(jq -r .name <<<"$MANIFEST")
              VER=$(jq -r .version <<<"$MANIFEST")
              STATUS=0
              scripts/release/npm-version-exists.sh "${NAME}@${VER}" || STATUS=$?
              case $STATUS in
                0) ;;
                1) MISSING="$MISSING $pkg" ;;
                *) exit "$STATUS" ;;
              esac
            done
            if [ -z "$MISSING" ] && git cat-file -e "$RELEASE_COMMIT:examples/two-agents/compose.yaml" 2>/dev/null; then
              BODY=""
              if BODY=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>"$RUNNER_TEMP/release-error"); then
                :
              elif grep -qxF 'release not found' "$RUNNER_TEMP/release-error"; then
                BODY=""
              else
                cat "$RUNNER_TEMP/release-error" >&2
                exit 1
              fi
              COMPLETE=true
              if git show "$RELEASE_COMMIT:examples/two-agents/compose.yaml" > "$RUNNER_TEMP/release-compose.yaml" &&
                REFS=$(scripts/release/example-images.sh refs "$RUNNER_TEMP/release-compose.yaml"); then
                while read -r ref; do
                  grep -qF "$ref" <<<"$BODY" || COMPLETE=false
                done <<<"$REFS"
              else
                COMPLETE=false
              fi
              if [ "$COMPLETE" = false ]; then
                for pkg in $RELEASE_PACKAGES; do
                  VER=$(git show "$RELEASE_COMMIT:packages/$pkg/package.json" | jq -r .version)
                  [ "$VER" != "$VERSION" ] || MISSING="$MISSING $pkg"
                done
              fi
            fi
            MISSING=${MISSING# }
            if [ -n "$MISSING" ] && [ "$START_NEW_VERSION" = "true" ]; then
              echo "Abandoning release $VERSION from $RELEASE_COMMIT; not yet on npm: $MISSING"
            elif [ -n "$MISSING" ]; then
              if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ] && [ "$(git rev-parse origin/main)" = "$RELEASE_COMMIT" ]; then
                echo "Release $VERSION is at the tip but this run started on $GITHUB_SHA; dispatching a run on the release commit"
                echo "mode=redispatch" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Resuming release $VERSION from $RELEASE_COMMIT; packages to finish: $MISSING"
              git checkout --quiet "$RELEASE_COMMIT"
              [ "$RELEASE_COMMIT" = "$GITHUB_SHA" ] || echo "::warning::main moved past the release commit $RELEASE_COMMIT; this run's provenance names $GITHUB_SHA"
              {
                echo "release-commit=$RELEASE_COMMIT"
                echo "mode=resume"
                echo "version=$VERSION"
                echo "packages=$MISSING"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -n "$GATED_COMMIT" ]; then
            if [ "$GITHUB_SHA" != "$GATED_COMMIT" ] || [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "::notice::main moved past the gated commit $GATED_COMMIT; the newer commit's own CI run gates it."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(GATE_COMMIT=$GATED_COMMIT scripts/release/push-gate.sh)" = skip ]; then
              echo "::notice::The release gate skipped $GATED_COMMIT; no new version will be released."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || {
            echo "ERROR: main moved past the dispatched commit $GITHUB_SHA; dispatch the release again from the tip"
            exit 1
          }
          # A version whose release commit and tag were pushed but whose
          # publish never completed is taken even though npm has never seen it.
          TAKEN_VERSIONS=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##')
          export TAKEN_VERSIONS
          VERSION=$(scripts/release/compute-next-version.sh $RELEASE_PACKAGES)
          echo "Next version: $VERSION"
          echo "mode=bump" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        run: pnpm install --frozen-lockfile

      # Package versions are never compiled into `dist`, so the build does not
      # depend on which packages the selection later moves to the version.
      - name: Build all packages
        if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        run: pnpm build

      # Recorded before the content hash, so the hash covers it. A resume
      # writes only the key the release commit's manifest already holds, so
      # its content hash is unchanged.
      - name: Record emitted wire version in published Client metadata
        if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        working-directory: packages/client
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          WIRE_VERSION=$(node --input-type=module -e 'import { WIRE_VERSION } from "@moltzap/client"; console.log(WIRE_VERSION)')
          jq --arg v "$WIRE_VERSION" --arg mode "$MODE" '
            if $mode == "bump" or has("sharnessWireVersion")
            then .sharnessWireVersion = $v else . end' package.json > tmp.json
          mv tmp.json package.json

      # A bump selects the changed packages and writes the version and content
      # hash into their manifests. A resume rebuilt the release commit's tree,
      # so each package it still owes must hash to the value that commit
      # recorded; a mismatch means the rebuild would publish other code than
      # the release commit describes. The example pins each @moltzap package
      # it installs from npm to that package's manifest version, so a checkout
      # of the release tag runs what that tag published.
      - name: Choose the packages this run publishes
        if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        id: select
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
          RESUME_PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          if [ "$MODE" = "resume" ]; then
            for pkg in $RESUME_PACKAGES; do
              RECORDED=$(jq -r '.sharnessContentHash // ""' "packages/$pkg/package.json")
              ACTUAL=$(node scripts/release/content-hash.ts "$pkg")
              [ "$RECORDED" = "$ACTUAL" ] || {
                echo "ERROR: packages/$pkg rebuilt to $ACTUAL, but the release commit recorded '$RECORDED'"
                exit 1
              }
            done
            echo "packages=$RESUME_PACKAGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SELECTED=$(node scripts/release/select-packages.ts "$VERSION" $RELEASE_PACKAGES)
          if [ -z "$SELECTED" ]; then
            echo "No package changed since the version its manifest names; nothing to release."
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing $VERSION for: $SELECTED"
          if [[ " $SELECTED " == *" openclaw-channel "* ]]; then
            HOST_CODE_HASH=$(node scripts/release/host-code-hash.ts openclaw-channel)
            jq --arg h "$HOST_CODE_HASH" '.sharnessHostCodeHash = $h' \
              packages/openclaw-channel/package.json > tmp.json
            mv tmp.json packages/openclaw-channel/package.json
          fi
          PINS='{}'
          for pkg in $RELEASE_PACKAGES; do
            PINS=$(jq --argjson pins "$PINS" '$pins + {(.name): .version}' "packages/$pkg/package.json")
          done
          jq --argjson pins "$PINS" \
            '.dependencies |= with_entries(if (.key | startswith("@moltzap/")) then .value = $pins[.key] else . end)' \
            examples/two-agents/package.json > tmp.json
          mv tmp.json examples/two-agents/package.json
          pnpm install --no-frozen-lockfile --ignore-scripts
          echo "packages=$SELECTED" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
      - name: Pin the release service images
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          KEYS=$(pnpm --silent image:keys)
          refs=()
          deadline=$((SECONDS + 45 * 60))
          for service in registry router; do
            key=$(jq -r --arg s "$service" '.[$s] | sub("^sha256:"; "")' <<<"$KEYS")
            image="ghcr.io/social-harness/$service"
            until digest=$(docker buildx imagetools inspect "$image:inputs-$key" --format '{{.Manifest.Digest}}'); do
              if (( SECONDS >= deadline )); then
                echo "ERROR: the images workflow must publish $service key $key and the ghcr.io/social-harness/{registry,router} packages must be public and pull anonymously; rerun once both conditions hold. Docs: https://docs.moltzap.xyz/spec/layer-interfaces#publication-and-versions" >&2
                exit 1
              fi
              remaining=$((deadline - SECONDS))
              echo "Waiting for $image:inputs-$key; $remaining seconds remain."
              sleep "$((remaining < 30 ? remaining : 30))"
            done
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            ref="$image@$digest"
            docker buildx imagetools inspect "$ref" >/dev/null || {
              echo "ERROR: the ghcr.io/social-harness/{registry,router} packages must be public and pull anonymously before release. Docs: https://docs.moltzap.xyz/spec/layer-interfaces#publication-and-versions" >&2
              exit 1
            }
            cosign verify \
              --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "$ref"
            refs+=("$ref")
          done
          for ref in "${refs[@]}"; do
            service=${ref#ghcr.io/social-harness/}
            scripts/release/example-images.sh pin examples/two-agents/compose.yaml "${service%@*}" "$ref"
          done

      # Pack gates install the published closures in isolated consumers.
      # NanoClaw checks its Client ABI without packing the source-copied adapter.
      - name: Verify the published closure installs from tarballs
        if: steps.select.outputs.packages != ''
        run: pnpm nx run-many -t test:pack,test:abi --parallel=4

      # The runner's pnpm install wired the husky hooks; the release commit
      # is made of generated output CI already gated, so the hooks stay out.
      # towncrier writes the version's CHANGELOG.md section from the fragments
      # in changelog.d/ and deletes them; with no fragments it writes nothing.
      # A rerun whose section is already written skips it. Without its marker
      # line towncrier would write above the file's title, so a missing marker
      # fails the release. This job can push to main and mint the npm OIDC
      # token, so towncrier and its dependencies install only from hash-pinned
      # requirements.
      - name: Make the release commit
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PACKAGES: ${{ steps.select.outputs.packages }}
          HUSKY: "0"
        run: |
          # The CHANGELOG preamble predates per-package versions; this rewrite
          # finds nothing to replace once a release commit has corrected it.
          # shellcheck disable=SC2016 # The backticks are Markdown, not a substitution.
          node -e '
            const fs = require("node:fs");
            const before = "Every published package\ncarries the same version in a release, and the release commit writes each\nsection below from the fragments in `changelog.d/`.";
            const after = "A release publishes at\nits version only the packages that changed since their last published version;\nthe release commit lists them and writes each section below from the fragments\nin `changelog.d/`.";
            fs.writeFileSync("CHANGELOG.md", fs.readFileSync("CHANGELOG.md", "utf8").replace(before, after));
          '
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            grep -qxF '<!-- towncrier release notes start -->' CHANGELOG.md \
              || { echo "CHANGELOG.md lost its towncrier marker"; exit 1; }
            python3 -m venv "$RUNNER_TEMP/towncrier"
            "$RUNNER_TEMP/towncrier/bin/pip" install --quiet --require-hashes --no-deps \
              -r scripts/release/towncrier-requirements.txt
            "$RUNNER_TEMP/towncrier/bin/towncrier" build \
              --version "$VERSION" --date "$(date -u +%F)" --yes
          fi

          git config user.name "moltzap-release[bot]"
          git config user.email "moltzap-release[bot]@users.noreply.github.com"
          git add packages/*/package.json examples/two-agents/package.json \
            examples/two-agents/compose.yaml \
            pnpm-lock.yaml CHANGELOG.md changelog.d/
          PUBLISHED=""
          for pkg in $PACKAGES; do
            PUBLISHED="$PUBLISHED$(jq -r '"- \(.name)@\(.version)"' "packages/$pkg/package.json")"$'\n'
          done
          git commit -m "chore(release): moltzap@$VERSION" -m "Publishes:"$'\n'"$PUBLISHED"
          git tag "v$VERSION"
          git bundle create "$RUNNER_TEMP/release.bundle" "refs/tags/v$VERSION" "^$GITHUB_SHA"

      - name: Keep the release commit for the push job
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 7

      # A resume packs the packages it still owes; the publish job publishes
      # exactly these files, checked against the checksums written here.
      - name: Pack the packages this run publishes
        if: steps.plan.outputs.mode == 'resume' && steps.select.outputs.packages != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          OUT="$RUNNER_TEMP/tarballs"
          mkdir -p "$OUT"
          for pkg in $PACKAGES; do
            VER=$(jq -r .version "packages/$pkg/package.json")
            [ "$VER" = "$VERSION" ] || { echo "ERROR: packages/$pkg is at $VER, expected $VERSION"; exit 1; }
            mkdir "$OUT/$pkg"
            (cd "packages/$pkg" && pnpm pack --pack-gzip-level 9 --pack-destination "$OUT/$pkg" >/dev/null)
            TARBALLS=("$OUT/$pkg"/*.tgz)
            [ "${#TARBALLS[@]}" -eq 1 ] && [ -f "${TARBALLS[0]}" ] || { echo "ERROR: pack of packages/$pkg did not write exactly one tarball"; exit 1; }
            printf '%s\t%s\t%s\n' "$pkg" "$(jq -r .name "packages/$pkg/package.json")" "$pkg/$(basename "${TARBALLS[0]}")" >> "$OUT/packages.tsv"
          done
          (cd "$OUT" && sha256sum ./*/*.tgz packages.tsv > SHA256SUMS)

      - name: Keep the tarballs for the publish job
        if: steps.plan.outputs.mode == 'resume' && steps.select.outputs.packages != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  push:
    needs: build
    if: needs.build.outputs.mode == 'bump' && needs.build.outputs.packages != ''
    runs-on: ubuntu-latest
    # The environment is where required reviewers for a release live; GitHub
    # creates it on first use, and the maintainer can add reviewers there.
    environment: release
    permissions:
      contents: read
      actions: write
    steps:
      # The release commit's parent; nothing here installs or runs
      # installed code, and the checkout keeps no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}

      # `build` ran installed dependencies, so the commit it made is checked
      # before it is pushed: one commit on the dispatched one, with the
      # release subject, touching only the files a release writes.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check the release commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          BUNDLE="$RUNNER_TEMP/release.bundle"
          git bundle verify --quiet "$BUNDLE"
          git fetch --quiet "$BUNDLE" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          COMMIT=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          [ "$(git show -s --format=%P "$COMMIT")" = "$GITHUB_SHA" ] || { echo "ERROR: the release commit's only parent is not $GITHUB_SHA"; exit 1; }
          [ "$(git log -1 --format=%s "$COMMIT")" = "chore(release): moltzap@$VERSION" ] || { echo "ERROR: unexpected release commit subject"; exit 1; }
          # Every change, read raw without rename detection: regular files
          # only, deletions only of changelog fragments, paths only those a
          # release writes.
          git diff --raw --no-renames -z "$GITHUB_SHA" "$COMMIT" > "$RUNNER_TEMP/changes"
          node --input-type=module - "$RUNNER_TEMP/changes" <<'JS'
          import { readFileSync } from "node:fs";
          const fields = readFileSync(process.argv[2], "latin1").split("\0");
          const written = /^(packages\/[^/]+\/package\.json|examples\/two-agents\/(package\.json|compose\.yaml)|pnpm-lock\.yaml|CHANGELOG\.md|docs\/.+\.mdx?|packages\/.+\/MODULE\.md|README\.md)$/;
          const problems = [];
          for (let i = 0; i + 1 < fields.length; i += 2) {
            const [, newMode, , , status] = fields[i].split(/[ \t]/);
            const file = fields[i + 1];
            if (status === "D") {
              if (!/^changelog\.d\/[^/]+\.md$/.test(file)) problems.push(`deletes ${file}`);
            } else if (newMode !== "100644") {
              problems.push(`${file} has mode ${newMode}`);
            } else if (!written.test(file)) {
              problems.push(`writes ${file}`);
            }
          }
          if (problems.length > 0) {
            console.error(`ERROR: the release commit does what a release never does:\n${problems.join("\n")}`);
            process.exit(1);
          }
          JS
          # A manifest is what npm installs, so a release may change only the
          # fields a release writes: the version, the recorded hashes and wire
          # version, and the versions of @moltzap dependencies.
          # shellcheck disable=SC2016 # The dollar signs are jq variables.
          RELEASE_FIELDS='del(.version, .sharnessContentHash, .sharnessHostCodeHash, .sharnessWireVersion)
            | (.dependencies // {}) |= with_entries(if (.key | startswith("@moltzap/")) then .value = "" else . end)'
          for manifest in $(git diff --name-only "$GITHUB_SHA" "$COMMIT" -- 'packages/*/package.json' examples/two-agents/package.json); do
            BEFORE=$(git show "$GITHUB_SHA:$manifest" | jq -S "$RELEASE_FIELDS")
            AFTER=$(git show "$COMMIT:$manifest" | jq -S "$RELEASE_FIELDS")
            [ "$BEFORE" = "$AFTER" ] || { echo "ERROR: the release commit changes $manifest beyond the fields a release writes"; exit 1; }
          done
          for revision in "$GITHUB_SHA" "$COMMIT"; do
            git show "$revision:examples/two-agents/compose.yaml" > "$RUNNER_TEMP/compose-$revision.yaml"
            scripts/release/example-images.sh normalize "$RUNNER_TEMP/compose-$revision.yaml" \
              > "$RUNNER_TEMP/compose-$revision"
          done
          cmp -s "$RUNNER_TEMP/compose-$GITHUB_SHA" "$RUNNER_TEMP/compose-$COMMIT" || { echo "ERROR: the release commit changes examples/two-agents/compose.yaml beyond the image digests"; exit 1; }
          REFS=$(scripts/release/example-images.sh refs "$RUNNER_TEMP/compose-$COMMIT.yaml")
          while read -r ref; do
            cosign verify \
              --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "$ref"
          done <<<"$REFS"
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"

      # The release App token is minted only now, scoped to contents, and
      # used for exactly one push.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The resume run is dispatched with the workflow token, which may start
      # a workflow_dispatch run; it queues in the concurrency group until this
      # run ends, then publishes from the release commit at the tip.
      - name: Push the release commit and dispatch its publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)" \
            push --atomic origin "$COMMIT:refs/heads/main" "refs/tags/v$VERSION"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Pushed $COMMIT as v$VERSION and dispatched the run that publishes it." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: needs.build.outputs.mode == 'resume' && needs.build.outputs.packages != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # For `.node-version`, the release scripts, and the release commit's
      # manifests, which name what each tarball must be; nothing here
      # installs dependencies or builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The repository Node pin ships npm >=11.5 for OIDC trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs

      # `build` ran installed dependencies, so its tarballs are checked
      # against the release commit before any is published: each holds the
      # name and version that commit's manifest gives and hashes to the
      # content hash that manifest records. A packed `publishConfig` could
      # point npm, and the OIDC token exchange, at another registry or
      # proxy, so a tarball carrying one is refused.
      - name: Publish every selected package not yet on npm at this version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGES: ${{ needs.build.outputs.packages }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
        run: |
          echo "npm version: $(npm --version)"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ERROR: GitHub OIDC token request env is missing; check id-token: write permissions"
            exit 1
          }
          [ "$(git log -1 --format=%s "$RELEASE_COMMIT")" = "chore(release): moltzap@$VERSION" ] || {
            echo "ERROR: $RELEASE_COMMIT is not the release commit of $VERSION"
            exit 1
          }
          OUT="$RUNNER_TEMP/tarballs"
          (cd "$OUT" && sha256sum --check --strict --quiet SHA256SUMS)
          for pkg in $PACKAGES; do
            ENTRY=$(awk -F '\t' -v p="$pkg" '$1 == p' "$OUT/packages.tsv")
            read -r _ _ FILE <<<"$ENTRY"
            [ -n "${FILE:-}" ] && [ -f "$OUT/$FILE" ] || { echo "ERROR: no tarball packed for $pkg"; exit 1; }
            RELEASED=$(git show "$RELEASE_COMMIT:packages/$pkg/package.json")
            EXPECTED="$(jq -r .name <<<"$RELEASED")@$(jq -r .version <<<"$RELEASED")"
            PACKED_MANIFEST=$(tar -xOzf "$OUT/$FILE" package/package.json)
            PACKED=$(jq -r '"\(.name)@\(.version)"' <<<"$PACKED_MANIFEST")
            [ "$EXPECTED" = "$PACKED" ] && [ "$PACKED" = "${EXPECTED%@*}@$VERSION" ] || {
              echo "ERROR: $FILE holds $PACKED, but the release commit names $EXPECTED at $VERSION"
              exit 1
            }
            jq -e 'has("publishConfig") | not' >/dev/null <<<"$PACKED_MANIFEST" || {
              echo "ERROR: $FILE carries a publishConfig"
              exit 1
            }
            RECORDED=$(jq -r '.sharnessContentHash // ""' <<<"$RELEASED")
            ACTUAL=$(node scripts/release/content-hash.ts --tarball "$OUT/$FILE")
            [ -n "$RECORDED" ] && [ "$RECORDED" = "$ACTUAL" ] || {
              echo "ERROR: $FILE hashes to $ACTUAL, but the release commit recorded '$RECORDED'"
              exit 1
            }
          done
          for pkg in $PACKAGES; do
            ENTRY=$(awk -F '\t' -v p="$pkg" '$1 == p' "$OUT/packages.tsv")
            read -r _ _ FILE <<<"$ENTRY"
            NAME=$(git show "$RELEASE_COMMIT:packages/$pkg/package.json" | jq -r .name)
            STATUS=0
            scripts/release/npm-version-exists.sh "${NAME}@${VERSION}" || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "${NAME}@${VERSION} already on npm — skipping"
              continue
            fi
            [ "$STATUS" -eq 1 ] || exit "$STATUS"
            echo "Publishing ${NAME}@${VERSION}..."
            npm publish "$OUT/$FILE" --access public --provenance --registry https://registry.npmjs.org/
          done

  # A run started on an older commit than the release commit at the tip only
  # starts the run that publishes it.
  redispatch:
    needs: build
    if: needs.build.outputs.mode == 'redispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch a run on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main

  images:
    needs: [build, publish]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      payload: ${{ steps.tag.outputs.payload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Tag release indexes and record their digests
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gh api "repos/$GITHUB_REPOSITORY/contents/examples/two-agents/compose.yaml?ref=$RELEASE_COMMIT" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/compose.yaml"
          REFS=$(scripts/release/example-images.sh refs "$RUNNER_TEMP/compose.yaml")
          while read -r ref; do
            cosign verify \
              --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "$ref"
          done <<<"$REFS"
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes" 2>"$RUNNER_TEMP/release-error"; then
            :
          elif grep -qxF 'release not found' "$RUNNER_TEMP/release-error"; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
            gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes"
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          while read -r ref; do
            image=${ref%@*}
            if digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect-error"); then
              [[ "$ref" == "$image@$digest" ]]
            elif grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/inspect-error"; then
              docker buildx imagetools create --tag "$image:$VERSION" "$ref"
            else
              cat "$RUNNER_TEMP/inspect-error" >&2
              exit 1
            fi
            if ! grep -qF "$ref" "$notes"; then
              printf '\n- `%s`\n' "$ref" >> "$notes"
            fi
          done <<<"$REFS"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          payload=$(jq -cn --arg version "$VERSION" '{version: $version}')
          while read -r ref; do
            service=${ref#ghcr.io/social-harness/}
            service=${service%@*}
            payload=$(jq -c --arg service "$service" --arg ref "$ref" '. + {($service): $ref}' <<<"$payload")
          done <<<"$REFS"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: images
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: social-harness
          repositories: deployment
          permission-contents: write
      - name: Notify deployment of the completed release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAYLOAD: ${{ needs.images.outputs.payload }}
        run: |
          jq -n --argjson payload "$PAYLOAD" '{event_type: "social-harness-released", client_payload: $payload}' \
            | gh api --method POST repos/social-harness/deployment/dispatches --input -
