name: Publish to npm

# Publishes selected package tarballs and tags verified service images.
# Release selection and recovery belong to docs/reference/spec/releases.md.
#
# Two runs bind npm provenance to the release commit. The first creates and
# pushes that commit, then dispatches the publishing run on main. A resume
# after main advances publishes the recorded tree, but its provenance names
# the dispatched commit. The plan step warns about that distinction.
#
# Keep installed code away from publishing credentials. `build` installs and
# packs without App or OIDC tokens. `push` validates the generated commit
# before using the App token. `publish` validates the packed artifacts before
# using OIDC. Neither privileged job installs or builds dependencies. This
# separation protects credentials, but cannot detect a dependency compromised
# in both builds that produces matching recorded hashes.
#
# Agent images complete independently of the required Registry and Router
# release. The daemon signature must name the release commit. Other input
# keys can survive many commits, so their signatures establish a build on
# main rather than freshness. A compromised build can supply an older signed
# OpenClaw index that still passes signature verification.
#
# Configure the release App with contents write on this repository and on
# social-harness/deployment, and permission to push main. Set its Actions
# variable RELEASE_APP_CLIENT_ID and secret RELEASE_APP_PRIVATE_KEY. Each npm
# package must trust this repository's publish.yml in the release environment
# before its first publication.
on:
  workflow_dispatch:
    inputs:
      gated_commit:
        description: >-
          Set by release-on-merge.yml to the commit whose CI passed. The run
          mints a version only for that commit, while it is main's tip, and
          only if the release gate still passes on it.
        type: string
        default: ""
      start_new_version:
        description: >-
          Abandon an incomplete release commit on main instead of resuming it
          and mint the next version from the tip. Deprecate by hand whatever
          the abandoned version did publish.
        type: boolean
        default: false

# Serialize version selection and publication. The resume waits for its bump
# run, while dispatches on other refs cannot replace a pending main run.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Explicit Bash enables pipefail, preventing partial pipeline results.
defaults:
  run:
    shell: bash

# Selection packs dependencies before their dependents.
env:
  RELEASE_PACKAGES: packages/social-harness plugins/openclaw
  IMAGE_CERTIFICATE_IDENTITY: https://github.com/social-harness/moltzap/.github/workflows/images.yml@refs/heads/main
  IMAGE_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    # Only main releases. A dispatch may name any branch, and the later jobs
    # push and publish, so an unreviewed branch must not reach here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      packages: ${{ steps.select.outputs.packages }}
      release-commit: ${{ steps.plan.outputs.release-commit }}
      images: ${{ steps.resolve.outputs.images }}
      agent-keys: ${{ steps.agent-keys.outputs.keys }}
    steps:
      # Full history: the plan step looks for the last release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          registry-url: https://registry.npmjs.org

      # An incomplete release resumes from its recorded tree. Redispatch
      # while that commit is still main's tip to preserve its provenance.
      - name: Decide whether this run bumps or resumes a release
        id: plan
        env:
          START_NEW_VERSION: ${{ inputs.start_new_version }}
          GATED_COMMIT: ${{ inputs.gated_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --quiet
          RELEASE_LINE=$(git log origin/main --format='%H %s' | grep -m1 ' chore(release): moltzap@' || true)
          if [ -n "$RELEASE_LINE" ]; then
            RELEASE_COMMIT=${RELEASE_LINE%% *}
            VERSION=${RELEASE_LINE#* chore(release): moltzap@}
            [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]] || {
              echo "ERROR: release commit $RELEASE_COMMIT has an unreadable version '$VERSION'"
              exit 1
            }
            MISSING=""
            for pkg in $RELEASE_PACKAGES; do
              MANIFEST=$(git show "$RELEASE_COMMIT:$pkg/package.json" 2>/dev/null) || continue
              NAME=$(jq -r .name <<<"$MANIFEST")
              VER=$(jq -r .version <<<"$MANIFEST")
              STATUS=0
              scripts/release/npm-version-exists.sh "${NAME}@${VER}" || STATUS=$?
              case $STATUS in
                0) ;;
                1) MISSING="$MISSING $pkg" ;;
                *) exit "$STATUS" ;;
              esac
            done
            # A release is complete once Registry and Router carry its version
            # tag and its release body lists the digest each tag names.
            if [ -z "$MISSING" ]; then
              BODY=""
              if BODY=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>"$RUNNER_TEMP/release-error"); then
                :
              elif grep -qxF 'release not found' "$RUNNER_TEMP/release-error"; then
                BODY=""
              else
                cat "$RUNNER_TEMP/release-error" >&2
                exit 1
              fi
              COMPLETE=true
              for service in registry router; do
                image="ghcr.io/social-harness/$service"
                STATUS=0
                digest=$(scripts/release/ghcr-digest.sh "$image:$VERSION") || STATUS=$?
                case $STATUS in
                  0) grep -qF "$image@$digest" <<<"$BODY" || COMPLETE=false ;;
                  1) COMPLETE=false ;;
                  *) exit "$STATUS" ;;
                esac
              done
              if [ "$COMPLETE" = false ]; then
                for pkg in $RELEASE_PACKAGES; do
                  VER=$(git show "$RELEASE_COMMIT:$pkg/package.json" | jq -r .version)
                  [ "$VER" != "$VERSION" ] || MISSING="$MISSING $pkg"
                done
              fi
            fi
            MISSING=${MISSING# }
            if [ -n "$MISSING" ] && [ "$START_NEW_VERSION" = "true" ]; then
              echo "Abandoning release $VERSION from $RELEASE_COMMIT; not yet on npm: $MISSING"
            elif [ -n "$MISSING" ]; then
              if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ] && [ "$(git rev-parse origin/main)" = "$RELEASE_COMMIT" ]; then
                echo "Release $VERSION is at the tip but this run started on $GITHUB_SHA; dispatching a run on the release commit"
                echo "mode=redispatch" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Resuming release $VERSION from $RELEASE_COMMIT; packages to finish: $MISSING"
              git checkout --quiet "$RELEASE_COMMIT"
              [ "$RELEASE_COMMIT" = "$GITHUB_SHA" ] || echo "::warning::main moved past the release commit $RELEASE_COMMIT; this run's provenance names $GITHUB_SHA"
              {
                echo "release-commit=$RELEASE_COMMIT"
                echo "mode=resume"
                echo "version=$VERSION"
                echo "packages=$MISSING"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -n "$GATED_COMMIT" ]; then
            if [ "$GITHUB_SHA" != "$GATED_COMMIT" ] || [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              echo "::notice::main moved past the gated commit $GATED_COMMIT; the newer commit's own CI run gates it."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Assigned first, so a failing gate fails the step instead of reading as a release.
            DECISION=$(GATE_COMMIT=$GATED_COMMIT scripts/release/push-gate.sh)
            if [ "$DECISION" = skip ]; then
              echo "::notice::The release gate skipped $GATED_COMMIT; no new version will be released."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || {
            echo "ERROR: main moved past the dispatched commit $GITHUB_SHA; dispatch the release again from the tip"
            exit 1
          }
          # A version whose release commit and tag were pushed but whose
          # publish never completed is taken even though npm has never seen it.
          TAKEN_VERSIONS=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##')
          export TAKEN_VERSIONS
          VERSION=$(scripts/release/compute-next-version.sh $RELEASE_PACKAGES)
          echo "Next version: $VERSION"
          echo "mode=bump" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        run: pnpm install --frozen-lockfile

      # Package versions are never compiled into `dist`, so the build does not
      # depend on which packages the selection later moves to the version.
      - name: Build all packages
        if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        run: pnpm build

      # Recorded before the content hash, so the hash covers it. A resume
      # writes only the key the release commit's manifest already holds, so
      # its content hash is unchanged.
      - name: Record emitted wire version in published Client metadata
        if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        working-directory: packages/social-harness
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          WIRE_VERSION=$(node --input-type=module -e 'import { WIRE_VERSION } from "@moltzap/social-harness"; console.log(WIRE_VERSION)')
          jq --arg v "$WIRE_VERSION" --arg mode "$MODE" '
            if $mode == "bump" or has("sharnessWireVersion")
            then .sharnessWireVersion = $v else . end' package.json > tmp.json
          mv tmp.json package.json

      # A bump selects the changed packages and writes the version and content
      # hash into their manifests. A resume rebuilt the release commit's tree,
      # so each package it still owes must hash to the value that commit
      # recorded; a mismatch means the rebuild would publish other code than
      # the release commit describes.
      - name: Choose the packages this run publishes
        if: steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume'
        id: select
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
          RESUME_PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          if [ "$MODE" = "resume" ]; then
            for pkg in $RESUME_PACKAGES; do
              RECORDED=$(jq -r '.sharnessContentHash // ""' "$pkg/package.json")
              ACTUAL=$(node scripts/release/content-hash.ts "$pkg")
              [ "$RECORDED" = "$ACTUAL" ] || {
                echo "ERROR: $pkg rebuilt to $ACTUAL, but the release commit recorded '$RECORDED'"
                exit 1
              }
            done
            echo "packages=$RESUME_PACKAGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SELECTED=$(node scripts/release/select-packages.ts "$VERSION" $RELEASE_PACKAGES)
          if [ -z "$SELECTED" ]; then
            echo "No package changed since the version its manifest names; nothing to release."
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing $VERSION for: $SELECTED"
          if [[ " $SELECTED " == *" plugins/openclaw "* ]]; then
            HOST_CODE_HASH=$(node scripts/release/host-code-hash.ts plugins/openclaw)
            jq --arg h "$HOST_CODE_HASH" '.sharnessHostCodeHash = $h' \
              plugins/openclaw/package.json > tmp.json
            mv tmp.json plugins/openclaw/package.json
          fi
          pnpm install --no-frozen-lockfile --ignore-scripts
          echo "packages=$SELECTED" >> "$GITHUB_OUTPUT"

      # Registry and Router input keys ignore what a release writes, so the
      # bump and the resume of one release resolve the same indexes. The
      # images job tags the ones this step passes on.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: (steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume') && steps.select.outputs.packages != ''
      - name: Resolve the release service images
        id: resolve
        if: (steps.plan.outputs.mode == 'bump' || steps.plan.outputs.mode == 'resume') && steps.select.outputs.packages != ''
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          KEYS=$(pnpm --silent image:keys registry router)
          images='{}'
          deadline=$((SECONDS + 45 * 60))
          for service in registry router; do
            key=$(jq -r --arg s "$service" '.[$s] | sub("^sha256:"; "")' <<<"$KEYS")
            image="ghcr.io/social-harness/$service"
            until digest=$(docker buildx imagetools inspect "$image:inputs-$key" --format '{{.Manifest.Digest}}'); do
              if (( SECONDS >= deadline )); then
                echo "ERROR: the images workflow must publish $service key $key and the ghcr.io/social-harness/{registry,router} packages must be public and pull anonymously; rerun once both conditions hold. Docs: https://docs.moltzap.xyz/reference/spec/releases#publication-and-versions" >&2
                exit 1
              fi
              remaining=$((deadline - SECONDS))
              echo "Waiting for $image:inputs-$key; $remaining seconds remain."
              sleep "$((remaining < 30 ? remaining : 30))"
            done
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            ref="$image@$digest"
            docker buildx imagetools inspect "$ref" >/dev/null || {
              echo "ERROR: the ghcr.io/social-harness/{registry,router} packages must be public and pull anonymously before release. Docs: https://docs.moltzap.xyz/reference/spec/releases#publication-and-versions" >&2
              exit 1
            }
            cosign verify \
              --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "$ref"
            images=$(jq -c --arg service "$service" --arg ref "$ref" '. + {($service): $ref}' <<<"$images")
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"

      # `image:keys` reads HEAD, which only the resume has at the release
      # commit; `agent-images` waits for images.yml to publish these keys.
      - name: Compute the agent image keys
        id: agent-keys
        if: steps.plan.outputs.mode == 'resume' && steps.select.outputs.packages != ''
        run: |
          KEYS=$(pnpm --silent image:keys daemon openclaw-agent)
          echo "keys=$(jq -c . <<<"$KEYS")" >> "$GITHUB_OUTPUT"

      # Pack gates install the published closures in isolated consumers.
      # NanoClaw checks its Client ABI without packing the source-copied adapter.
      - name: Verify the published closure installs from tarballs
        if: steps.select.outputs.packages != ''
        run: pnpm nx run-many -t test:pack,test:abi --parallel=4

      # Generated release output bypasses local Husky hooks. The push job
      # validates this commit before publishing it. Towncrier's marker keeps
      # its output below the changelog title, and hash-pinned requirements bind
      # the formatter and its dependencies.
      - name: Make the release commit
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PACKAGES: ${{ steps.select.outputs.packages }}
          HUSKY: "0"
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            grep -qxF '<!-- towncrier release notes start -->' CHANGELOG.md \
              || { echo "CHANGELOG.md lost its towncrier marker"; exit 1; }
            python3 -m venv "$RUNNER_TEMP/towncrier"
            "$RUNNER_TEMP/towncrier/bin/pip" install --quiet --require-hashes --no-deps \
              -r scripts/release/towncrier-requirements.txt
            "$RUNNER_TEMP/towncrier/bin/towncrier" build \
              --version "$VERSION" --date "$(date -u +%F)" --yes
          fi

          git config user.name "social-harness-release[bot]"
          git config user.email "social-harness-release[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml CHANGELOG.md changelog.d/
          PUBLISHED=""
          for pkg in $PACKAGES; do
            git add "$pkg/package.json"
            PUBLISHED="$PUBLISHED$(jq -r '"- \(.name)@\(.version)"' "$pkg/package.json")"$'\n'
          done
          git commit -m "chore(release): moltzap@$VERSION" -m "Publishes:"$'\n'"$PUBLISHED"
          git tag "v$VERSION"
          git bundle create "$RUNNER_TEMP/release.bundle" "refs/tags/v$VERSION" "^$GITHUB_SHA"

      - name: Keep the release commit for the push job
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}/release.bundle
          if-no-files-found: error
          retention-days: 7

      # A resume packs the packages it still owes; the publish job publishes
      # exactly these files, checked against the checksums written here.
      - name: Pack the packages this run publishes
        if: steps.plan.outputs.mode == 'resume' && steps.select.outputs.packages != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          OUT="$RUNNER_TEMP/tarballs"
          mkdir -p "$OUT"
          for pkg in $PACKAGES; do
            VER=$(jq -r .version "$pkg/package.json")
            [ "$VER" = "$VERSION" ] || { echo "ERROR: $pkg is at $VER, expected $VERSION"; exit 1; }
            mkdir -p "$OUT/$pkg"
            (cd "$pkg" && pnpm pack --pack-gzip-level 9 --pack-destination "$OUT/$pkg" >/dev/null)
            TARBALLS=("$OUT/$pkg"/*.tgz)
            [ "${#TARBALLS[@]}" -eq 1 ] && [ -f "${TARBALLS[0]}" ] || { echo "ERROR: pack of $pkg did not write exactly one tarball"; exit 1; }
            printf '%s\t%s\t%s\n' "$pkg" "$(jq -r .name "$pkg/package.json")" "$pkg/$(basename "${TARBALLS[0]}")" >> "$OUT/packages.tsv"
          done
          mapfile -t FILES < <(cut -f3 "$OUT/packages.tsv")
          (cd "$OUT" && sha256sum "${FILES[@]}" packages.tsv > SHA256SUMS)

      - name: Keep the tarballs for the publish job
        if: steps.plan.outputs.mode == 'resume' && steps.select.outputs.packages != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 7

  push:
    needs: build
    if: needs.build.outputs.mode == 'bump' && needs.build.outputs.packages != ''
    runs-on: ubuntu-latest
    # The environment is where required reviewers for a release live; GitHub
    # creates it on first use, and the maintainer can add reviewers there.
    environment: release
    permissions:
      contents: read
      actions: write
    steps:
      # The release commit's parent; nothing here installs or runs
      # installed code, and the checkout keeps no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-commit
          path: ${{ runner.temp }}

      # `build` ran installed dependencies, so the commit it made is checked
      # before it is pushed: one commit on the dispatched one, with the
      # release subject, touching only the files a release writes.
      - name: Check the release commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          BUNDLE="$RUNNER_TEMP/release.bundle"
          git bundle verify --quiet "$BUNDLE"
          git fetch --quiet "$BUNDLE" "refs/tags/v$VERSION:refs/tags/v$VERSION"
          COMMIT=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          [ "$(git show -s --format=%P "$COMMIT")" = "$GITHUB_SHA" ] || { echo "ERROR: the release commit's only parent is not $GITHUB_SHA"; exit 1; }
          [ "$(git log -1 --format=%s "$COMMIT")" = "chore(release): moltzap@$VERSION" ] || { echo "ERROR: unexpected release commit subject"; exit 1; }
          # Every change, read raw without rename detection: regular files
          # only, deletions only of changelog fragments, paths only those a
          # release writes.
          git diff --raw --no-renames -z "$GITHUB_SHA" "$COMMIT" > "$RUNNER_TEMP/changes"
          node --input-type=module - "$RUNNER_TEMP/changes" <<'JS'
          import { readFileSync } from "node:fs";
          const fields = readFileSync(process.argv[2], "latin1").split("\0");
          const written = new Set([
            ...process.env.RELEASE_PACKAGES.split(/\s+/u).filter(Boolean).map((dir) => `${dir}/package.json`),
            "pnpm-lock.yaml",
            "CHANGELOG.md",
          ]);
          const problems = [];
          for (let i = 0; i + 1 < fields.length; i += 2) {
            const [, newMode, , , status] = fields[i].split(/[ \t]/);
            const file = fields[i + 1];
            if (status === "D") {
              if (!/^changelog\.d\/[^/]+\.md$/.test(file)) problems.push(`deletes ${file}`);
            } else if (newMode !== "100644") {
              problems.push(`${file} has mode ${newMode}`);
            } else if (!written.has(file)) {
              problems.push(`writes ${file}`);
            }
          }
          if (problems.length > 0) {
            console.error(`ERROR: the release commit does what a release never does:\n${problems.join("\n")}`);
            process.exit(1);
          }
          JS
          # A manifest is what npm installs, so a release may change only the
          # fields a release writes: the version, the recorded hashes and wire
          # version, and the versions of @moltzap dependencies.
          # shellcheck disable=SC2016 # The dollar signs are jq variables.
          RELEASE_FIELDS='del(.version, .sharnessContentHash, .sharnessHostCodeHash, .sharnessWireVersion)
            | (.dependencies // {}) |= with_entries(if (.key | startswith("@moltzap/")) then .value = "" else . end)'
          for manifest in $(git diff --name-only "$GITHUB_SHA" "$COMMIT" -- '*/package.json'); do
            BEFORE=$(git show "$GITHUB_SHA:$manifest" | jq -S "$RELEASE_FIELDS")
            AFTER=$(git show "$COMMIT:$manifest" | jq -S "$RELEASE_FIELDS")
            [ "$BEFORE" = "$AFTER" ] || { echo "ERROR: the release commit changes $manifest beyond the fields a release writes"; exit 1; }
          done
          echo "COMMIT=$COMMIT" >> "$GITHUB_ENV"

      # The release App token is minted only now, scoped to contents, and
      # used for exactly one push.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The resume run is dispatched with the workflow token, which may start
      # a workflow_dispatch run; it queues in the concurrency group until this
      # run ends, then publishes from the release commit at the tip.
      - name: Push the release commit and dispatch its publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)" \
            push --atomic origin "$COMMIT:refs/heads/main" "refs/tags/v$VERSION"
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Pushed $COMMIT as v$VERSION and dispatched the run that publishes it." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: needs.build.outputs.mode == 'resume' && needs.build.outputs.packages != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # For `.node-version`, the release scripts, and the release commit's
      # manifests, which name what each tarball must be; nothing here
      # installs dependencies or builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The repository Node pin ships npm >=11.5 for OIDC trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs

      # `build` ran installed dependencies, so its tarballs are checked
      # against the release commit before any is published: each holds the
      # name and version that commit's manifest gives and hashes to the
      # content hash that manifest records. A packed `publishConfig` could
      # point npm, and the OIDC token exchange, at another registry or
      # proxy, so a tarball carrying one is refused.
      - name: Publish every selected package not yet on npm at this version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PACKAGES: ${{ needs.build.outputs.packages }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
        run: |
          echo "npm version: $(npm --version)"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ERROR: GitHub OIDC token request env is missing; check id-token: write permissions"
            exit 1
          }
          [ "$(git log -1 --format=%s "$RELEASE_COMMIT")" = "chore(release): moltzap@$VERSION" ] || {
            echo "ERROR: $RELEASE_COMMIT is not the release commit of $VERSION"
            exit 1
          }
          OUT="$RUNNER_TEMP/tarballs"
          (cd "$OUT" && sha256sum --check --strict --quiet SHA256SUMS)
          for pkg in $PACKAGES; do
            ENTRY=$(awk -F '\t' -v p="$pkg" '$1 == p' "$OUT/packages.tsv")
            read -r _ _ FILE <<<"$ENTRY"
            [ -n "${FILE:-}" ] && [ -f "$OUT/$FILE" ] || { echo "ERROR: no tarball packed for $pkg"; exit 1; }
            RELEASED=$(git show "$RELEASE_COMMIT:$pkg/package.json")
            EXPECTED="$(jq -r .name <<<"$RELEASED")@$(jq -r .version <<<"$RELEASED")"
            PACKED_MANIFEST=$(tar -xOzf "$OUT/$FILE" package/package.json)
            PACKED=$(jq -r '"\(.name)@\(.version)"' <<<"$PACKED_MANIFEST")
            [ "$EXPECTED" = "$PACKED" ] && [ "$PACKED" = "${EXPECTED%@*}@$VERSION" ] || {
              echo "ERROR: $FILE holds $PACKED, but the release commit names $EXPECTED at $VERSION"
              exit 1
            }
            jq -e 'has("publishConfig") | not' >/dev/null <<<"$PACKED_MANIFEST" || {
              echo "ERROR: $FILE carries a publishConfig"
              exit 1
            }
            RECORDED=$(jq -r '.sharnessContentHash // ""' <<<"$RELEASED")
            ACTUAL=$(node scripts/release/content-hash.ts --tarball "$OUT/$FILE")
            [ -n "$RECORDED" ] && [ "$RECORDED" = "$ACTUAL" ] || {
              echo "ERROR: $FILE hashes to $ACTUAL, but the release commit recorded '$RECORDED'"
              exit 1
            }
          done
          for pkg in $PACKAGES; do
            ENTRY=$(awk -F '\t' -v p="$pkg" '$1 == p' "$OUT/packages.tsv")
            read -r _ _ FILE <<<"$ENTRY"
            NAME=$(git show "$RELEASE_COMMIT:$pkg/package.json" | jq -r .name)
            STATUS=0
            scripts/release/npm-version-exists.sh "${NAME}@${VERSION}" || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "${NAME}@${VERSION} already on npm — skipping"
              continue
            fi
            [ "$STATUS" -eq 1 ] || exit "$STATUS"
            echo "Publishing ${NAME}@${VERSION}..."
            npm publish "$OUT/$FILE" --access public --provenance --registry https://registry.npmjs.org/
          done

  # A run started on an older commit than the release commit at the tip only
  # starts the run that publishes it.
  redispatch:
    needs: build
    if: needs.build.outputs.mode == 'redispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch a run on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main

  images:
    needs: [build, publish]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      payload: ${{ steps.tag.outputs.payload }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # `build` ran installed code, so the references it passes are checked
      # for shape and signature before anything is tagged.
      - name: Tag release indexes and record their digests
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGES: ${{ needs.build.outputs.images }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          registry=$(jq -r '.registry // ""' <<<"$IMAGES")
          router=$(jq -r '.router // ""' <<<"$IMAGES")
          [[ "$registry" =~ ^ghcr\.io/social-harness/registry@sha256:[a-f0-9]{64}$ &&
            "$router" =~ ^ghcr\.io/social-harness/router@sha256:[a-f0-9]{64}$ ]] || {
            echo "ERROR: build passed no Registry and Router digest references: $IMAGES" >&2
            exit 1
          }
          REFS=$(printf '%s\n%s' "$registry" "$router")
          while read -r ref; do
            cosign verify \
              --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "$ref"
          done <<<"$REFS"
          while read -r ref; do
            image=${ref%@*}
            if digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect-error"); then
              [[ "$ref" == "$image@$digest" ]] || {
                echo "ERROR: $image:$VERSION already names $digest, not $ref" >&2
                exit 1
              }
            elif grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/inspect-error"; then
              docker buildx imagetools create --tag "$image:$VERSION" "$ref"
            else
              cat "$RUNNER_TEMP/inspect-error" >&2
              exit 1
            fi
          done <<<"$REFS"
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes" 2>"$RUNNER_TEMP/release-error"; then
            :
          elif grep -qxF 'release not found' "$RUNNER_TEMP/release-error"; then
            gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=v$VERSION" \
              -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/CHANGELOG.md"
            awk -v heading="## [$VERSION]" \
              'index($0, heading) == 1 { keep = 1; next } keep && /^## / { exit } keep' \
              "$RUNNER_TEMP/CHANGELOG.md" > "$notes"
            printf '\n### Images\n' >> "$notes"
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$notes"
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          while read -r ref; do
            grep -qF "$ref" "$notes" || printf '\n- `%s`\n' "$ref" >> "$notes"
          done <<<"$REFS"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          payload=$(jq -c --arg version "$VERSION" '. + {version: $version}' <<<"$IMAGES")
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: images
    runs-on: ubuntu-24.04
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: social-harness
          repositories: deployment
          permission-contents: write
      - name: Notify deployment of the completed release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PAYLOAD: ${{ needs.images.outputs.payload }}
        run: |
          jq -n --argjson payload "$PAYLOAD" '{event_type: "social-harness-released", client_payload: $payload}' \
            | gh api --method POST repos/social-harness/deployment/dispatches --input -

  agent-images:
    needs: [build, images]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # `build` ran installed code, so the keys it passes are checked for
      # shape before use. The OpenClaw agent, whose key is usually published
      # long before, goes first and each image is recorded once tagged, so a
      # missing daemon leaves it tagged.
      - name: Tag the agent images and record their digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
          KEYS: ${{ needs.build.outputs.agent-keys }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          notes="$RUNNER_TEMP/notes.md"
          body=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          printf '%s\n' "$body" > "$notes"
          deadline=$((SECONDS + 45 * 60))
          for service in openclaw-agent daemon; do
            key=$(jq -r --arg s "$service" '.[$s] // "" | sub("^sha256:"; "")' <<<"$KEYS")
            [[ "$key" =~ ^[a-f0-9]{64}$ ]] || {
              echo "ERROR: build passed no $service input key: $KEYS" >&2
              exit 1
            }
            image="ghcr.io/social-harness/$service"
            until digest=$(docker buildx imagetools inspect "$image:inputs-$key" --format '{{.Manifest.Digest}}'); do
              if (( SECONDS >= deadline )); then
                echo "ERROR: images.yml has not published $image:inputs-$key for release $VERSION. Re-run images.yml's run for the release commit $RELEASE_COMMIT, then re-run this job. Docs: https://docs.moltzap.xyz/reference/spec/releases#publication-and-versions" >&2
                exit 1
              fi
              remaining=$((deadline - SECONDS))
              echo "Waiting for $image:inputs-$key; $remaining seconds remain."
              sleep "$((remaining < 30 ? remaining : 30))"
            done
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            ref="$image@$digest"
            commit=()
            [ "$service" != daemon ] || commit=(--certificate-github-workflow-sha "$RELEASE_COMMIT")
            cosign verify \
              --certificate-identity "$IMAGE_CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$IMAGE_CERTIFICATE_OIDC_ISSUER" "${commit[@]}" "$ref"
            if tagged=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/inspect-error"); then
              [ "$tagged" = "$digest" ] || {
                echo "ERROR: $image:$VERSION already names $tagged, not $ref" >&2
                exit 1
              }
            elif grep -Eqi 'manifest unknown|not found' "$RUNNER_TEMP/inspect-error"; then
              docker buildx imagetools create --tag "$image:$VERSION" "$ref"
            else
              cat "$RUNNER_TEMP/inspect-error" >&2
              exit 1
            fi
            # shellcheck disable=SC2016 # The backticks are Markdown.
            grep -qF "$ref" "$notes" || {
              printf '\n- `%s`\n' "$ref" >> "$notes"
              gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            }
          done
