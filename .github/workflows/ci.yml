name: CI

on:
  push:
    branches: [main]
  pull_request:

# Optional self-hosted Nx remote cache: jobs read with NX_CACHE_TOKEN; main
# (nx-cache-write environment) and same-repository pull requests
# (NX_CACHE_WRITE_TOKEN) write. Forks and Dependabot run without it;
# NX_CACHE_DISABLED=true turns it off everywhere.

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]') && 'true' || 'false' }}
    steps:
      # Depth 2 gives the CHANGELOG.md guard the merge commit's parents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The release commit writes CHANGELOG.md from the fragments in
      # changelog.d/, so a pull request adds a fragment instead of editing it.
      # HEAD is the pull request's merge commit, whose first parent is its
      # base; a base without towncrier.toml still takes hand-written entries.
      - name: Refuse CHANGELOG.md edits
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e HEAD^1:towncrier.toml 2>/dev/null \
            && ! git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::This pull request edits CHANGELOG.md; add a fragment under changelog.d/ instead (see towncrier.toml)"
            exit 1
          fi
      # The release's own draft build rejects a misnamed fragment or a broken
      # template here, before the next release would.
      - name: Render the changelog fragments
        if: github.event_name == 'pull_request'
        run: |
          python3 -m venv "$RUNNER_TEMP/towncrier"
          "$RUNNER_TEMP/towncrier/bin/pip" install --quiet --require-hashes --no-deps \
            -r scripts/release/towncrier-requirements.txt
          "$RUNNER_TEMP/towncrier/bin/towncrier" build --draft --version 0.0.0
      - uses: ./.github/actions/setup-toolchain

      - run: pnpm install --frozen-lockfile
      - name: Verify pnpm-lock.yaml matches package.json and the catalog
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm build
      # Pack gates install the published closures in isolated consumers.
      # NanoClaw checks its Client ABI without packing the source-copied adapter.
      - name: Verify the published closure installs from tarballs
        run: pnpm nx run-many -t test:pack,test:abi --parallel=4
      - run: pnpm typecheck
      - run: pnpm nx run-many -t typecheck:tests
      - name: Lint
        run: pnpm lint
        timeout-minutes: 30
      # `pnpm build` and `pnpm lint` already run every project's build, lint,
      # and arch:check; this step pins the resolved graph itself: every
      # project, root, edge, and package-specific target. Unit tests run in
      # `test`, process lanes in `integration`, and adjacent-release checks
      # in `mixed-release`.
      - name: Verify the Nx project graph
        run: |
          pnpm nx graph --print > "${RUNNER_TEMP}/sharness-project-graph.json"
          node scripts/architecture/check-boundaries.ts --nx-graph "${RUNNER_TEMP}/sharness-project-graph.json"
      - run: pnpm format:check
      - run: pnpm docs:check:drift
      - run: pnpm docs:check
      - run: pnpm docs:check:mermaid
      - run: pnpm docs:check:gates-test
      - run: pnpm test:compute-next-version
      - run: pnpm test:npm-version-exists
      - run: pnpm test:select-packages
      - run: pnpm nx run workspace:test:image-input-key
      - run: pnpm test:client-host-imports

  test:
    runs-on: ubuntu-latest
    # Bounds a hung test run.
    timeout-minutes: 20
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]') && 'true' || 'false' }}
    steps:
      # A pull request runs only the projects its diff affects, against the PR
      # base that nx-set-shas resolves; fetch-depth: 0 gives it that history.
      # A push to main runs every project. Each target builds what it needs
      # through dependsOn, so there is no separate build step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        if: github.event_name == 'pull_request'
      - name: Test the affected projects
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t test
      - name: Test every project
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t test

  integration:
    runs-on: ubuntu-latest
    # Bounds a hung test run.
    timeout-minutes: 20
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        if: github.event_name == 'pull_request'
      - name: Run affected process lanes
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t test:integration --parallel=4
      - name: Run every process lane
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t test:integration --parallel=4

  mixed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @moltzap/integration-tests:test:mixed-release

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build service images for amd64
        run: |
          docker buildx create --use
          for service in registry router; do
            docker buildx build --platform linux/amd64 --load \
              --file "images/${service}/Dockerfile" \
              --tag "sharness-${service}:ci" .
          done
      - name: Smoke-test deployed executables
        run: |
          docker run --rm sharness-registry:ci --help
          docker run --rm sharness-router:ci --help
          docker run --rm --entrypoint pglite-server sharness-registry:ci --help
      - name: Verify Router health
        run: |
          signer=$(docker run --rm --entrypoint node sharness-router:ci -e '
            const {publicKey} = require("node:crypto").generateKeyPairSync("ed25519");
            const {crv, kty, x} = publicKey.export({format: "jwk"});
            console.log(JSON.stringify({crv, kty, x}));
          ')
          trap 'docker logs sharness-router-smoke; docker rm -f sharness-router-smoke' EXIT
          docker run --detach --name sharness-router-smoke \
            --env SHARNESS_ROUTER_REGISTRY_ORIGIN=http://127.0.0.1:3001 \
            --env "SHARNESS_ROUTER_REGISTRY_SIGNER_PUBLIC_KEY=${signer}" \
            sharness-router:ci
          docker exec sharness-router-smoke node --input-type=module -e '
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                const response = await fetch("http://127.0.0.1:3002/healthz");
                if (response.status === 204) process.exit(0);
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 500));
            }
            throw new Error("Router /healthz did not return 204");
          '
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm install --frozen-lockfile
      - name: Run the npm consumer example against these images
        env:
          SHARNESS_REGISTRY_IMAGE: sharness-registry:ci
          SHARNESS_ROUTER_IMAGE: sharness-router:ci
        run: pnpm nx run @moltzap/integration-tests:test:example
